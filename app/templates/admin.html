<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка загрузки</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="admin-page">
    <main class="admin-card">
      <a href="/" class="back-link">← Меню</a>
      <h1>Загрузка зданий в базу</h1>
      <p>
        Добавьте название, описание и фото здания. Данные сразу попадут в базу и
        начнут использоваться в квизе и уроках.
      </p>

      <form id="uploadForm" class="admin-form">
        <label>
          Название
          <input type="text" name="name" required />
        </label>
        <label>
          Описание
          <textarea name="description" rows="5" required></textarea>
        </label>
        <label>
          Фото
          <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp" required />
        </label>
        <button class="btn btn-primary" type="submit">Загрузить</button>
      </form>

      <p id="status"></p>
    </main>

    <script src="/static/js/admin.js" defer></script>
  </body>
</html>
